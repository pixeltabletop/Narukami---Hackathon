# Corre la verificación en una máquina limpia en cada push: compilación, tipos
# y la batería de pruebas, incluida la que falla si aparece una URL externa o un
# motor de inferencia distinto a QVAC.
#
# Que compile en el equipo de quien lo escribió no prueba que compile en el de
# quien lo descarga. Es la única forma de saber que un jurado que clone el
# repositorio puede ejecutarlo.
#
# Windows a propósito: es la plataforma donde se desarrolla y donde se graba la
# demostración, y el SDK de QVAC trae binarios por plataforma.

name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Pruebas
        run: npm test
